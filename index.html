<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #fff;
    color: #000;
    font-family: "Cascadia Mono", "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #price {
    font-size: clamp(3rem, 13vw, 12rem);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #label {
    margin-top: 1.5rem;
    font-size: clamp(0.8rem, 1.6vw, 1.2rem);
    color: #999;
    letter-spacing: 0.35em;
  }
</style>
</head>
<body>
  <div id="price">&hellip;</div>
  <div id="label">BTC / EUR</div>
<script>
  const priceEl = document.getElementById("price");

  function render(eur) {
    priceEl.textContent = "€" + Math.round(eur).toLocaleString("en-US");
  }

  async function fetchPrice() {
    try {
      const r = await fetch("https://api.coinbase.com/v2/prices/BTC-EUR/spot");
      const j = await r.json();
      return parseFloat(j.data.amount);
    } catch {
      const r = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCEUR");
      const j = await r.json();
      return parseFloat(j.price);
    }
  }

  async function tick() {
    try {
      render(await fetchPrice());
    } catch {
      /* keep last shown value; retry on next tick */
    }
  }

  tick();
  setInterval(tick, 5000);
</script>
</body>
</html>
